<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuaPocket – Du'a harian | Daily du'a</title>
<meta name="description" content="Koleksi du'a harian dengan Arab, rumi, terjemahan Melayu dan English. Daily du'a with Arabic, transliteration, Malay and English.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#14231c;--mute:#5a6b62;--green:#0f3d2e;--gold:#b8892b;--line:#d9e3dc;--onGreen:#f2f6f3}
:root[data-theme="dark"]{--bg:#0c1713;--card:#13241d;--ink:#e8efe9;--mute:#9db0a5;--green:#1c5a44;--gold:#d9a93f;--line:#24392f;--onGreen:#f2f6f3}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55}
header{background:var(--green);color:var(--onGreen);padding:2.2rem 1.2rem 1.6rem;text-align:center;border-bottom:4px solid var(--gold)}
header h1{margin:0;font-size:2rem;letter-spacing:.2px}
header .ar{font-family:Amiri,serif;font-size:1.6rem;color:var(--gold);margin:.2rem 0}
header p{margin:.3rem auto 0;max-width:34rem;opacity:.9}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:.8rem 1rem .6rem;border-bottom:1px solid var(--line)}
.row{max-width:42rem;margin:0 auto;display:flex;gap:.5rem}
input[type=search]{flex:1;font:inherit;padding:.7rem .9rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer}
.icon{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:0 .8rem}
.chips{max-width:42rem;margin:.6rem auto 0;display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.2rem}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:.4rem .9rem}
.chip[aria-pressed=true]{background:var(--green);color:var(--onGreen);border-color:var(--green)}
main{max-width:42rem;margin:1.2rem auto 3rem;padding:0 1rem}
.dua{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.2rem 1rem;margin-bottom:1rem}
.dua h2{margin:0 0 .6rem;font-size:1.05rem;color:var(--green)}
:root[data-theme="dark"] .dua h2{color:var(--gold)}
.arabic{font-family:Amiri,serif;font-size:calc(1.9rem * var(--z,1));line-height:2.1;text-align:right;direction:rtl;margin:.2rem 0 .6rem;padding-bottom:.6rem;border-bottom:1px dashed var(--gold)}
.rumi{font-style:italic;color:var(--mute);margin:.2rem 0}
.ms,.en{margin:.35rem 0}
.en{color:var(--mute)}
.src{font-size:.85rem;color:var(--mute);margin-top:.6rem}
.acts{display:flex;gap:.5rem;margin-top:.7rem}
.acts button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:.4rem .8rem;font-size:.9rem}
.acts button:hover{border-color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:2rem 0}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:0 1rem 2.5rem;max-width:36rem;margin:0 auto}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--green);color:var(--onGreen);padding:.6rem 1rem;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>DuaPocket</h1>
  <div class="ar">دُعَاء</div>
  <p>Du'a harian untuk setiap saat. Daily du'a for every moment.</p>
</header>

<div class="tools">
  <div class="row">
    <input type="search" id="q" placeholder="Cari / Search (cth: makan, tidur, masjid)" aria-label="Search du'a">
    <button class="icon" id="smaller" aria-label="Smaller Arabic text">A−</button>
    <button class="icon" id="bigger" aria-label="Larger Arabic text">A+</button>
    <button class="icon" id="theme" aria-label="Toggle dark mode">🌙</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<main id="list"></main>

<footer>
  Dibuat oleh belia untuk komuniti. Sila semak semula du'a dengan ustaz/ustazah anda. · Made by youth, for the community. Please verify with a qualified teacher.
</footer>
<div class="toast" id="toast"></div>

<script>
const DUAS=[
{cat:"Pagi & Tidur",ms_t:"Ketika bangun tidur",en_t:"Upon waking up",
 ar:"الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ",
 rumi:"Alhamdu lillahilladhi ahyana ba'da ma amatana wa ilaihin-nushur.",
 ms:"Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kami akan dibangkitkan.",
 en:"All praise is for Allah who gave us life after causing us to die, and to Him is the resurrection.",
 src:"Sahih al-Bukhari"},
{cat:"Pagi & Tidur",ms_t:"Sebelum tidur",en_t:"Before sleeping",
 ar:"بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا",
 rumi:"Bismika Allahumma amutu wa ahya.",
 ms:"Dengan nama-Mu ya Allah, aku mati dan aku hidup.",
 en:"In Your name, O Allah, I die and I live.",
 src:"Sahih al-Bukhari"},
{cat:"Makan",ms_t:"Sebelum makan",en_t:"Before eating",
 ar:"بِسْمِ اللَّهِ",
 rumi:"Bismillah.",
 ms:"Dengan nama Allah. (Jika terlupa di awal: Bismillahi awwalahu wa akhirah.)",
 en:"In the name of Allah. (If forgotten at the start: Bismillahi awwalahu wa akhirah.)",
 src:"Abu Dawud, at-Tirmidhi"},
{cat:"Makan",ms_t:"Selepas makan",en_t:"After eating",
 ar:"الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ",
 rumi:"Alhamdu lillahilladhi at'amana wa saqana wa ja'alana muslimin.",
 ms:"Segala puji bagi Allah yang telah memberi kami makan dan minum serta menjadikan kami orang Islam.",
 en:"All praise is for Allah who fed us, gave us drink, and made us Muslims.",
 src:"Abu Dawud, at-Tirmidhi"},
{cat:"Masjid",ms_t:"Masuk masjid",en_t:"Entering the masjid",
 ar:"اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ",
 rumi:"Allahummaf-tah li abwaba rahmatik.",
 ms:"Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.",
 en:"O Allah, open for me the doors of Your mercy.",
 src:"Sahih Muslim"},
{cat:"Masjid",ms_t:"Keluar masjid",en_t:"Leaving the masjid",
 ar:"اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ",
 rumi:"Allahumma inni as'aluka min fadlik.",
 ms:"Ya Allah, sesungguhnya aku memohon kurnia-Mu.",
 en:"O Allah, I ask You for Your bounty.",
 src:"Sahih Muslim"},
{cat:"Perjalanan",ms_t:"Keluar rumah",en_t:"Leaving home",
 ar:"بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ",
 rumi:"Bismillah, tawakkaltu 'alallah, wa la hawla wa la quwwata illa billah.",
 ms:"Dengan nama Allah, aku bertawakal kepada Allah, tiada daya dan kekuatan melainkan dengan pertolongan Allah.",
 en:"In the name of Allah, I place my trust in Allah; there is no power or strength except with Allah.",
 src:"Abu Dawud, at-Tirmidhi"},
{cat:"Perjalanan",ms_t:"Menaiki kenderaan",en_t:"Riding a vehicle",
 ar:"سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَى رَبِّنَا لَمُنقَلِبُونَ",
 rumi:"Subhanalladhi sakh-khara lana hadha wa ma kunna lahu muqrinin, wa inna ila Rabbina la-munqalibun.",
 ms:"Maha Suci Tuhan yang menundukkan kenderaan ini untuk kami, sedangkan kami tidak mampu menguasainya, dan kepada Tuhan kami, kami akan kembali.",
 en:"Glory to Him who subdued this for us, though we could not have done so ourselves, and to our Lord we will return.",
 src:"Al-Quran, Az-Zukhruf 43:13-14"},
{cat:"Umum",ms_t:"Kebaikan dunia dan akhirat",en_t:"Good in this life and the next",
 ar:"رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ",
 rumi:"Rabbana atina fid-dunya hasanah, wa fil-akhirati hasanah, wa qina 'adhaban-nar.",
 ms:"Ya Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan peliharalah kami daripada azab neraka.",
 en:"Our Lord, grant us good in this world and good in the next, and protect us from the punishment of the Fire.",
 src:"Al-Quran, Al-Baqarah 2:201"}
];
const ALL="Semua / All";
let cat=ALL, zoom=1;
const $=id=>document.getElementById(id);
const cats=[ALL,...new Set(DUAS.map(d=>d.cat))];

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function plain(d){return `${d.ms_t} / ${d.en_t}\n\n${d.ar}\n\n${d.rumi}\n\n${d.ms}\n${d.en}\n\n(${d.src})`}

function chips(){
  $("chips").innerHTML="";
  cats.forEach(c=>{
    const b=document.createElement("button");
    b.className="chip";b.textContent=c;b.setAttribute("aria-pressed",c===cat);
    b.onclick=()=>{cat=c;chips();render()};
    $("chips").appendChild(b);
  });
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const items=DUAS.map((d,i)=>({d,i})).filter(({d})=>
    (cat===ALL||d.cat===cat)&&(!q||[d.ms_t,d.en_t,d.rumi,d.ms,d.en,d.cat].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML=items.length?items.map(({d,i})=>`
  <article class="dua">
    <h2>${d.ms_t} · ${d.en_t}</h2>
    <p class="arabic" lang="ar">${d.ar}</p>
    <p class="rumi">${d.rumi}</p>
    <p class="ms">${d.ms}</p>
    <p class="en">${d.en}</p>
    <p class="src">Sumber / Source: ${d.src}</p>
    <div class="acts">
      <button data-copy="${i}">Salin / Copy</button>
      <button data-share="${i}">WhatsApp</button>
    </div>
  </article>`).join(""):`<p class="empty">Tiada hasil. Cuba kata kunci lain. No results found, try another word.</p>`;
}
$("list").addEventListener("click",e=>{
  const c=e.target.dataset.copy,s=e.target.dataset.share;
  if(c!==undefined){navigator.clipboard.writeText(plain(DUAS[c])).then(()=>toast("Disalin / Copied"),()=>toast("Gagal / Failed"))}
  if(s!==undefined){window.open("https://wa.me/?text="+encodeURIComponent(plain(DUAS[s])+"\n\n"+location.href),"_blank")}
});
$("q").addEventListener("input",render);
function zoomTo(v){zoom=Math.min(1.6,Math.max(.8,v));document.documentElement.style.setProperty("--z",zoom)}
$("bigger").onclick=()=>zoomTo(zoom+.15);
$("smaller").onclick=()=>zoomTo(zoom-.15);
function setTheme(t){document.documentElement.dataset.theme=t;$("theme").textContent=t==="dark"?"☀️":"🌙";try{localStorage.setItem("theme",t)}catch(e){}}
$("theme").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
let saved=null;try{saved=localStorage.getItem("theme")}catch(e){}
setTheme(saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
chips();render();
</script>
</body>
</html>
